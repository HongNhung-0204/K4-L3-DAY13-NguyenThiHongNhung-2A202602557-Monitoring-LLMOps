service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Giữ mục tiêu 99.5% cho request thành công trong <= 3000ms. Baseline CP1 có 14 response
    mẫu với P95 1288ms; mẫu lab nhỏ nên dùng làm mốc chạy thử, không xem là phân phối production.
    Error budget 0.5% cho phép tối đa 50 request không đạt trên mỗi 10,000 request trong cửa sổ 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
