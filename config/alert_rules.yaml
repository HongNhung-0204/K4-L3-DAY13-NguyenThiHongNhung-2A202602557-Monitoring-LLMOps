alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 2000ms
    duration: 5m
    type: symptom-based
    channel: slack
    channel_name: "#k4-l3b-alerts"
    owner: student-02557
    runbook: docs/alerts.md#alert-1
  - name: ElevatedRequestErrorRate
    severity: critical
    condition: request_failed / request_received * 100 > 2%
    duration: 3m
    type: symptom-based
    channel: slack
    channel_name: "#k4-l3b-alerts"
    owner: student-02557
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: successful retrieval tool calls / all retrieval tool calls * 100 < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    channel_name: "#k4-l3b-alerts"
    owner: student-02557
    runbook: docs/alerts.md#alert-3
